# Resolver DNS interno do Docker, usado para revalidar o IP do backend
# periodicamente em vez de resolve-lo apenas na inicializacao do Nginx.
# Isso evita erros "Connection refused" quando o container do backend
# e recriado/reiniciado e recebe um novo IP na rede do Docker.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para a API do backend.
    # Requisicoes feitas pelo Angular para /api/... sao redirecionadas
    # para o backend Spring Boot, eliminando problemas de CORS
    # pois o navegador ve tudo como a mesma origem.
    #
    # O host e definido em uma variavel (set $backend_upstream) para
    # forcar o Nginx a resolver o DNS a cada requisicao (respeitando o
    # "resolver" acima), em vez de resolver apenas uma vez no start.
    #
    # Como o proxy_pass usa uma variavel, o Nginx NAO remove
    # automaticamente o prefixo "/api/" da URI (comportamento padrao
    # quando o destino e um valor fixo). Por isso, o rewrite abaixo
    # remove manualmente o prefixo antes de repassar a requisicao.
    location /api/ {
        set $backend_upstream http://backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Suporte ao Angular Router (SPA): qualquer rota nao encontrada
    # cai de volta para o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estaticos
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
