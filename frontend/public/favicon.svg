<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#16213e"/>
      <stop offset="55%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f9ff"/>
      <stop offset="60%" stop-color="#dfe4f2"/>
      <stop offset="100%" stop-color="#c3cbe4"/>
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f4e8"/>
      <stop offset="100%" stop-color="#e0c9a6"/>
    </linearGradient>
  </defs>

  <!-- Fundo circular "meia-noite" -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Estrelas -->
  <circle cx="12" cy="14" r="1.2" fill="#ffffff" opacity="0.85"/>
  <circle cx="50" cy="10" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="54" cy="24" r="1.3" fill="#ffffff" opacity="0.9"/>
  <circle cx="8" cy="30" r="0.9" fill="#ffffff" opacity="0.6"/>

  <!-- Lua crescente -->
  <g>
    <circle cx="40" cy="18" r="9" fill="url(#moon)"/>
    <circle cx="35.5" cy="15" r="9" fill="url(#bg)"/>
  </g>

  <!-- Livro estilizado -->
  <g transform="translate(14, 36)">
    <path d="M0 4 C6 0 14 0 18 4 L18 22 C14 18 6 18 0 22 Z" fill="url(#book)"/>
    <path d="M36 4 C30 0 22 0 18 4 L18 22 C22 18 30 18 36 22 Z" fill="url(#book)"/>
    <line x1="18" y1="4" x2="18" y2="22" stroke="#16213e" stroke-width="1"/>
  </g>
</svg>
